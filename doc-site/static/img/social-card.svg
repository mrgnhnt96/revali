<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 675" width="1600" height="675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f4f6fe"/>
      <stop offset="1" stop-color="#e6eafb"/>
    </linearGradient>
    <linearGradient id="wing" x1="20" y1="10" x2="120" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="letter" x1="100" y1="50" x2="190" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7a8df0"/>
      <stop offset="1" stop-color="#4e5fc6"/>
    </linearGradient>
    <!-- oversized wing used as a low-contrast background motif -->
    <g id="wing-shape">
      <path d="M 110 82  A 64 64 0 0 1 30 14  A 200 200 0 0 0 110 82 Z"/>
      <path d="M 108 112 A 64 64 0 0 1 10 54  A 200 200 0 0 0 108 112 Z"/>
      <path d="M 108 142 A 64 64 0 0 1 16 110 A 200 200 0 0 0 108 142 Z"/>
    </g>
    <g id="letter-shape" fill="none" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 100 198 V 66 H 140 A 38 38 0 0 1 140 142 H 100"/>
      <path d="M 126 144 L 184 198"/>
    </g>
  </defs>

  <rect width="1600" height="675" fill="url(#bg)"/>

  <!-- background motif: the wing, oversized, bleeding off the right edge -->
  <g transform="translate(1180 -120) scale(4.2) rotate(-8 60 90)" opacity="0.09">
    <use href="#wing-shape" fill="#4e5fc6"/>
  </g>

  <!-- primary mark, height 320 -->
  <g transform="translate(104 169.6) scale(1.6)">
    <use href="#wing-shape" fill="url(#wing)"/>
    <use href="#letter-shape" stroke="url(#letter)"/>
  </g>

  <!-- wordmark, cap height 104 -->
  <g transform="translate(489.75 142.5) scale(1.3)">
    <g fill="none" stroke="#1f2937" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 20 100 V 20 H 52 A 21 21 0 0 1 52 62 H 20"/>
      <path d="M 44 62 L 74 100"/>
      <path d="M 100 68 H 148 A 24 24 0 1 0 134 90"/>
      <path d="M 168 36 L 188 100 L 208 36"/>
      <path d="M 256 44 A 24 24 0 1 1 256 92 A 24 24 0 1 1 256 44"/>
      <path d="M 280 36 V 100"/>
      <path d="M 304 20 V 100"/>
      <path d="M 330 36 V 100"/>
    </g>
    <circle cx="330" cy="17" r="8.5" fill="#1f2937"/>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="76" fill="#1f2937">
    <text x="490" y="427">Build <tspan fill="#4e5fc6">APIs</tspan> Faster</text>
    <text x="490" y="523">Code Less, Deliver <tspan fill="#d97706">More</tspan></text>
  </g>
</svg>
