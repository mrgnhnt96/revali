name: revali_docs
description: The Revali documentation site, published to docs.revali.dev.
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  jaspr: ^0.23.3
  jaspr_content: ^0.5.3
  jaspr_router: ^0.8.3
  # Imported directly by lib/components/search.dart. Always via `universal_web`,
  # never `dart:js_interop`: the search component is a `@client` component
  # rendered inside the header, so it gets compiled for the SERVER too, where
  # `dart:js_interop` is unavailable and the build fails.
  universal_web: ^1.1.1

dev_dependencies:
  build_runner: ^2.10.0
  build_web_compilers: ^4.8.0
  jaspr_builder: ^0.23.3
  # Run via `dart run jaspr_cli:jaspr` — a project dependency rather than a
  # global activation, so a clean checkout can build with no extra setup.
  jaspr_cli: ^0.23.3
  lints: ^6.0.0
  test: ^1.26.0
  # Build-time only: tool/gen_og_cards.dart renders the per-page social cards.
  crypto: ^3.0.6
  og_card:
    path: ../packages/og_card

jaspr:
  mode: static
