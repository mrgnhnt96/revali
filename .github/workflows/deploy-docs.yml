name: Deploy docs

# Builds doc-site/ (Jaspr, static mode) and publishes the output to
# mrgnhnt96/revali-docs, whose GitHub Pages site serves docs.revali.dev.
#
# Why a second repository rather than actions/deploy-pages on this one:
# GitHub allows one Pages site per repository, and a Pages site serves exactly
# one custom domain. Keeping the docs in their own artifact repo leaves this
# repo's single Pages site free for revali.dev, and means a docs deploy can
# never reassign that domain by shipping a different CNAME.
#
# ============================================================================
# ONE-TIME SETUP — done on 2026-08-10, recorded here so it can be rebuilt if
# the publish repo is ever recreated:
#
# 1. `mrgnhnt96/revali-docs` exists and is PUBLIC. It holds only generated
#    output; a public repo also gets Pages on the free tier. Its `main` branch
#    was seeded by a local run of the steps below, because GitHub will not let
#    you point Pages at a branch that does not exist yet.
#
# 2. Its Pages source is "Deploy from a branch", branch `main`, folder
#    `/ (root)`. The custom domain came from the `CNAME` file in the pushed
#    content — Pages reads it, no separate API call.
#
# 3. Auth is an SSH DEPLOY KEY, not a PAT: an ed25519 key with write access
#    scoped to `mrgnhnt96/revali-docs` alone ("CI deploy (revali/deploy-docs.yml)"
#    under that repo's Deploy keys), with the private half stored here as the
#    `REVALI_DOCS_DEPLOY_KEY` secret. Deliberately not a PAT — a classic PAT
#    with `repo` scope can write to every repo the owner can, and the default
#    `GITHUB_TOKEN` cannot be used at all, since it only ever grants access to
#    the repo a workflow runs in. To rotate: generate a new keypair, replace
#    the deploy key there and the secret here.
#
# 4. DNS: a CNAME record for `docs.revali.dev` -> `mrgnhnt96.github.io`. A
#    subdomain, so a plain CNAME works; no apex ALIAS/ANAME workaround. The
#    `CNAME` file in doc-site/web/ is what tells Pages which domain to serve
#    and provision a certificate for — it does NOT create the DNS record, and
#    if it ever goes missing from a deploy the custom domain is silently
#    unset. Hence the verification step below.
# ============================================================================

on:
  push:
    branches: [main]
    paths:
      - 'doc-site/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch: {}

# Read-only on purpose: this workflow writes to revali-docs with
# REVALI_DOCS_DEPLOY_KEY and needs no elevated permission here. No
# `pages`/`id-token` either — those are for actions/deploy-pages, which only
# ever deploys the repo it runs in.
permissions:
  contents: read

# One publish at a time, and never cancelled mid-push: a half-pushed branch is
# a half-deployed site.
concurrency:
  group: docs-pages
  cancel-in-progress: false

env:
  DOCS_REPOSITORY: mrgnhnt96/revali-docs
  DOCS_DOMAIN: docs.revali.dev

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: doc-site

    steps:
      # `fetch-depth: 0` is load-bearing, not caution. The default is a depth-1
      # clone with exactly one commit, and `src/git_lastmod.dart` dates each
      # page from the last commit that touched it — against a shallow clone
      # every page resolves to that single commit, so all 111 sitemap entries
      # get one identical date and the result looks like a working per-page
      # `lastmod` while carrying no information at all. `dart test` fails on
      # this rather than letting it ship, but the fix is here.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.12.2'

      - name: Get dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      # Regenerated rather than trusted. `dart test` also fails on a stale
      # committed index, but a deploy should never ship one either way.
      - name: Build the search index
        run: dart run tool/build_search_index.dart

      # One card per page, ~10MB of PNGs. Generated here rather than committed:
      # they are derived entirely from page titles and the template, and a
      # template change rewrites all 97 at once, which is not a diff anyone
      # wants in their history. web/images/og/ is gitignored to match.
      - name: Generate the social cards
        run: dart run tool/gen_og_cards.dart

      - name: Build the site
        run: dart run jaspr_cli:jaspr build

      # NOT `jaspr build --sitemap-domain`. That flag emits `<loc>$domain$route`
      # with no hook to shape the URL, and GitHub Pages 301-redirects the
      # no-slash form of every route — so it produced a sitemap of 111
      # redirects. Owning the file is what lets one function
      # (lib/src/canonical.dart) build both the sitemap `<loc>` and the page's
      # own rel=canonical, which is the only way the two cannot drift.
      #
      # After the build, because `jaspr build` deletes build/jaspr on the way
      # in; a sitemap written before it is silently thrown away.
      - name: Generate the sitemap
        run: dart run tool/build_sitemap.dart

      # After the build, so the anchor test can check every search result's
      # deep link against the HTML that is about to be published.
      - name: Test
        run: dart test

      # A silently-empty build would publish a blank site over a working one,
      # and the custom domain is lost the moment CNAME goes missing.
      - name: Verify the build output
        working-directory: doc-site/build/jaspr
        run: |
          test -s index.html || { echo "::error::index.html missing or empty"; exit 1; }
          grep -qx "$DOCS_DOMAIN" CNAME || {
            echo "::error::CNAME missing or wrong: $(cat CNAME 2>/dev/null)"; exit 1; }
          test -s search-index.json || {
            echo "::error::search-index.json was not published"; exit 1; }
          pages=$(find . -name index.html | wc -l)
          [ "$pages" -ge 90 ] || {
            echo "::error::only $pages pages rendered; expected the full site"; exit 1; }
          # robots.txt advertises this; a missing one is an advertised 404, and
          # Search Console reports the subscribed sitemap as "couldn't fetch"
          # rather than falling back to crawling.
          test -s robots.txt || { echo "::error::robots.txt was not published"; exit 1; }
          test -s sitemap.xml || { echo "::error::sitemap.xml was not generated"; exit 1; }
          # A sitemap listing one route is what a build that lost its routes
          # produces, and it is still perfectly valid XML — so count them. The
          # bound matches the page count above: every rendered page is a URL.
          urls=$(grep -c "<loc>" sitemap.xml)
          [ "$urls" -ge 90 ] || {
            echo "::error::sitemap.xml lists only $urls URLs; expected one per page"; exit 1; }
          # The origin comes from content/_data/site.yaml, so a wrong value
          # there ships a sitemap of URLs on someone else's host.
          grep -q "<loc>https://$DOCS_DOMAIN/" sitemap.xml || {
            echo "::error::sitemap.xml URLs are not on $DOCS_DOMAIN"; exit 1; }
          # Every <loc> must end in a slash: that is the form Pages serves with
          # a 200, and the bare form is a 301. `dart test` compares each one
          # against its page's rel=canonical; this is the cheap blunt version
          # of the same check, run against the artifact about to be published.
          bare=$(grep -o "<loc>[^<]*</loc>" sitemap.xml | grep -vc "/</loc>" || true)
          [ "$bare" -eq 0 ] || {
            echo "::error::$bare sitemap URLs do not end in a slash; they will 301"; exit 1; }
          # Per-page dates actually reached the file. `dart test` proves git has
          # the history; this proves GitLastModDataLoader was wired in and used
          # it. Unwired, every page falls back to the build clock and lands on
          # one identical timestamp -- valid XML carrying no signal.
          stamps=$(grep -o "<lastmod>[^<]*</lastmod>" sitemap.xml | sort -u | wc -l)
          [ "$stamps" -gt 1 ] || {
            echo "::error::all $urls sitemap entries share one lastmod; per-page dates were not applied"
            exit 1; }
          # Every page names its own card in og:image, so a missing directory
          # would leave 97 previews pointing at a 404 -- and nothing else here
          # would notice, since the HTML is perfectly valid either way.
          cards=$(find images/og -name '*.png' 2>/dev/null | wc -l)
          [ "$cards" -ge 90 ] || {
            echo "::error::only $cards social cards published; expected one per page"; exit 1; }
          # Spot-check that the tool and the layout agree on the file name.
          card=$(grep -o 'og:image" content="[^"]*"' revali/cli/routes/index.html | head -1 | sed 's|.*docs.revali.dev||;s|"$||')
          test -s ".$card" || {
            echo "::error::og:image points at $card, which was not published"; exit 1; }

      - name: Publish to ${{ env.DOCS_REPOSITORY }}
        working-directory: doc-site/build/jaspr
        env:
          DEPLOY_KEY: ${{ secrets.REVALI_DOCS_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::REVALI_DOCS_DEPLOY_KEY is not set — see the setup notes at the top of this workflow"
            exit 1
          fi

          # Written under RUNNER_TEMP, not the workspace, so a stray `git add`
          # can never sweep the private key into the published artifact.
          key="$RUNNER_TEMP/docs_deploy_key"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          trap 'rm -f "$key"' EXIT

          # Jaspr leaves build bookkeeping behind; it is not part of the site.
          #
          # `packages/` is 6MB across ~300 files that `build_web_compilers`
          # emits for the debug `packages/` URL scheme — dev-dependency READMEs
          # and fix_data.yaml files. The release dart2js bundle references none
          # of it, and one of those files is `packages/test/…/browser/static/
          # index.html`, a crawlable page on docs.revali.dev that has nothing to
          # do with Revali.
          #
          # Checked, not assumed — unlike the landing site this app does have a
          # client entrypoint, so the day the bundle needs `packages/` the grep
          # fails the deploy instead of silently breaking hydration.
          if grep -rqE '(src|href)="/?packages/' --include='*.html' . \
              --exclude-dir=packages || grep -q '"packages/' main.client.dart.js; then
            echo "::error::the site references packages/ — do not prune it"
            exit 1
          fi
          rm -rf .dart_tool .build.manifest packages

          # REQUIRED, not boilerplate: a branch-source Pages site runs Jekyll by
          # default, which silently drops any path segment beginning with an
          # underscore.
          touch .nojekyll

          # Published as a single orphan commit, force-pushed: each build is a
          # few MB of generated output including a dart2js bundle that changes
          # wholesale, so history there would grow without ever being useful.
          # The meaningful history is this repo's, and the commit message
          # records which commit produced the deploy.
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from ${GITHUB_REPOSITORY}"

          GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git push -q --force "git@github.com:${DOCS_REPOSITORY}.git" main
